<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><title>System Probe</title>
<style>
html,body{margin:0;background:#0f141c;color:#e9f0f8;font:26px Arial,sans-serif}
main{padding:52px 72px}h1{font-size:46px;margin:0 0 8px}
p.sub{color:#9fb0c6;font-size:22px;margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:26px}
.card{background:#18212e;border:2px solid #2b3a4f;border-radius:12px;padding:22px}
.card h2{font-size:20px;color:#9fb0c6;margin:0 0 10px;font-weight:normal}
.card .v{font-size:40px;font-weight:bold}
.card .u{font-size:20px;color:#9fb0c6;margin-left:6px}
pre{white-space:pre-wrap;font:22px/1.5 monospace;background:#141b25;border-radius:10px;padding:20px;max-height:340px;overflow:auto}
button{font:inherit;padding:16px 22px;border:3px solid #3f5570;background:#1b2532;color:#e9f0f8;border-radius:10px}
button:focus{outline:4px solid #75dcba;background:#22453d}
footer{color:#8fa1b8;font-size:20px;margin-top:18px}
</style></head>
<body><main>
<h1>系统探针</h1>
<p class="sub">只读 · 不修改系统 · 数据来自 Tizen SystemInfo API</p>
<div class="grid">
  <div class="card"><h2>CPU 负载</h2><div><span class="v" id="cpu">--</span><span class="u" id="cpuPct"></span></div></div>
  <div class="card"><h2>可用内存</h2><div><span class="v" id="memAvail">--</span><span class="u" id="memTotal"></span></div></div>
  <div class="card"><h2>内存状态</h2><div><span class="v" id="memStatus">--</span></div></div>
</div>
<pre id="detail">正在读取…</pre>
<button id="refresh">刷新（红色键同样可用）</button>
<footer id="note">整机数值，不是按进程统计。Tizen 不提供进程级资源接口。</footer>
</main><script src="app.js"></script></body></html>
